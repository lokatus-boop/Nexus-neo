<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Nexus Neo</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16233a"/>
      <stop offset="1" stop-color="#070b14"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.46" r="0.55">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#6366f1" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon" x1="140" y1="380" x2="372" y2="132" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#halo)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="110.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <!-- Órbita: la red que conecta los nodos -->
  <ellipse cx="256" cy="256" rx="196" ry="86" transform="rotate(-32 256 256)" fill="none" stroke="#38bdf8" stroke-opacity="0.28" stroke-width="6" stroke-dasharray="2 18" stroke-linecap="round"/>
  <!-- La «N» como grafo de conexiones -->
  <g filter="url(#glow)">
    <path d="M168 352 V160 L344 352 V160" fill="none" stroke="url(#neon)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#070b14" stroke="url(#neon)" stroke-width="14">
      <circle cx="168" cy="160" r="30"/>
      <circle cx="344" cy="352" r="30"/>
    </g>
    <circle cx="168" cy="352" r="30" fill="#2dd4bf"/>
    <circle cx="344" cy="160" r="30" fill="#a78bfa"/>
  </g>
  <!-- Cursor del terminal -->
  <rect x="384" y="378" width="56" height="18" rx="6" fill="#e2e8f0" opacity="0.92"/>
</svg>
