name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Servidores de prueba (Linux)
        if: runner.os == 'Linux'
        # xrdp para el visor RDP integrado y mosh-server para el cliente Mosh.
        run: |
          sudo apt-get update
          sudo apt-get install -y xrdp mosh
          sudo systemctl start xrdp || true
      - run: npm test
      - name: Prueba de interfaz (Linux)
        if: runner.os == 'Linux'
        run: |
          npx playwright install-deps chromium
          NEXUS_RDP_TEST=127.0.0.1:3389 xvfb-run -a npm run test:ui
      - name: Empaquetar
        run: npm run build:prod && npx electron-builder ${{ runner.os == 'Windows' && '--win' || '--linux' }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-neo-${{ runner.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
          if-no-files-found: warn

  release:
    # Al etiquetar una versión (git tag v0.1.1 && git push --tags) publica los instaladores.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefactos
      - uses: softprops/action-gh-release@v2
        with:
          name: Nexus Neo ${{ github.ref_name }}
          generate_release_notes: true
          files: artefactos/**/*
